  <circle cx="256" cy="245" r="70" fill="url(#blueGrad)" stroke="#38BDF8" stroke-width="8" />
  <circle cx="256" cy="245" r="35" fill="#0F172A" />
  <!-- Lightning Bolt for Topa Tudo Speed & Power -->
  <path d="M265 140 L215 250 L260 250 L245 350 L310 230 L265 230 Z" fill="url(#amberGrad)" stroke="#B45309" stroke-width="4" stroke-linejoin="round" />
  <!-- TT Text badge at bottom -->
  <rect x="156" y="415" width="200" height="42" rx="21" fill="#F8FAFC" />
  <text x="256" y="445" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#1E3A8A" text-anchor="middle" letter-spacing="3">TOPA TUDO</text>
</svg>
